[project]
name = "mail-client-service"
version = "0.1.0"
description = "FastAPI service for mail client operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    # Workspace dependencies
    "mail-client-api",
    "gmail-client-impl",
    "gmail-message-impl",
]

[tool.uv.sources]
mail-client-api = { workspace = true }
gmail-client-impl = { workspace = true }
gmail-message-impl = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "pytest-cov>=6.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

